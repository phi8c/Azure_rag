
name: Build AI Backend Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        working-directory: backend
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name AIBackend --paths . --collect-all uvicorn --collect-all fastapi --collect-all azure --collect-all duckdb run_server.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path "backend/dist/AIBackend/*" -DestinationPath "AI-Backend-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Backend-Windows
          path: AI-Backend-Windows.zip
          retention-days: 7
