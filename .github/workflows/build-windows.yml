
name: Build AI Backend Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify requirements file
        working-directory: backend
        run: |
          if (-not (Test-Path "requirements.lock.txt")) {
            throw "Missing backend/requirements.lock.txt"
          }

          Write-Host "Requirements lock file found."

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify imports
        working-directory: backend
        run: |
          python -c "import uvicorn, fastapi, duckdb; from app.main import app; print('Backend imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build executable
        working-directory: backend
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name AIBackend `
            --paths . `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all azure `
            --collect-all duckdb `
            --collect-all docling `
            --collect-all docling_core `
            --collect-all docling_parse `
            --collect-all docling_ibm_models `
            run_server.py

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "dist/AIBackend/AIBackend.exe")) {
            throw "AIBackend.exe was not generated"
          }

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path "backend/dist/AIBackend/*" `
            -DestinationPath "AI-Backend-Windows.zip" `
            -Force

          if (-not (Test-Path "AI-Backend-Windows.zip")) {
            throw "ZIP creation failed"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Backend-Windows
          path: AI-Backend-Windows.zip
          if-no-files-found: error
          retention-days: 7
